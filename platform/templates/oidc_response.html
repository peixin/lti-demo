<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8">
  <title>Launching…</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .loading-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 3rem;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }
  </style>
</head>
<body>
<div class="loading-card">
  <span style="font-size:3rem; margin-bottom:1.5rem; display:inline-block; animation: pulseIcon 2s infinite ease-in-out;">🚀</span>
  <p class="subtitle is-6" style="font-weight:700; color:#4f46e5; margin-bottom:1.5rem; letter-spacing:0.02em;">
    {{ t('launching') }}
  </p>
  <progress class="progress is-info" max="100" style="max-width:320px; margin:auto; height:8px; border-radius:9999px;"></progress>

  <form id="f" method="post" action="{{ redirect_uri }}">
    <input type="hidden" name="id_token" value="{{ id_token }}">
    <input type="hidden" name="state"    value="{{ state }}">
  </form>
  <script>setTimeout(function(){ document.getElementById('f').submit(); }, 300);</script>
</div>

<style>
  @keyframes pulseIcon {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15) rotate(5deg); }
  }
</style>
</body>
</html>
