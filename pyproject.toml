[project]
name = "lti-demo"
version = "0.0.1"
description = "A minimal end-to-end demo of LTI 1.3 (Learning Tools Interoperability) with OIDC launch flow and AGS grade passback, built with Flask and SQLite."
authors = [
    {name = "liupeixin",email = "fengyi.mail@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "pyjwt[crypto]>=2.8",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
